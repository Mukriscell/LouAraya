name: louaraya-control3
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: louaraya
      POSTGRES_USER: louaraya
      POSTGRES_PASSWORD: ${LOUARAYA_DB_PASSWORD:?Define LOUARAYA_DB_PASSWORD en el entorno o backend/.env}
    ports:
      - "127.0.0.1:${LOUARAYA_DB_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d louaraya -U louaraya"]
      interval: 3s
      timeout: 3s
      retries: 20
  ntfy:
    profiles: ["push"]
    image: binwiederhier/ntfy:v2.37.2
    command: serve
    environment:
      NTFY_BASE_URL: http://10.0.2.2:8090
      NTFY_CACHE_DURATION: "0"
      NTFY_WEB_ROOT: disable
    ports:
      - "127.0.0.1:8090:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/v1/health"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
